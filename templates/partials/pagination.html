{% if page_obj.paginator.num_pages > 1 %}<nav class="pagination" aria-label="Pagination"><span>{{ page_obj.start_index }}–{{ page_obj.end_index }} of {{ page_obj.paginator.count }} results</span><div>{% if page_obj.has_previous %}<a href="{% querystring page=page_obj.previous_page_number %}" aria-label="Previous page">←</a>{% endif %}{% for n in page_obj.paginator.page_range %}<a href="{% querystring page=n %}" {% if n == page_obj.number %}aria-current="page"{% endif %}>{{ n }}</a>{% endfor %}{% if page_obj.has_next %}<a href="{% querystring page=page_obj.next_page_number %}" aria-label="Next page">→</a>{% endif %}</div></nav>{% endif %}
